<style>
/* Layout: fixed full-screen WebGL tower; HTML "visitor pass" cards slide in beside the scene; lift panel on the right edge. One night-time look on purpose. */
:root{
  --night:#0a1226;        /* sky / page ground */
  --panel:#101a33;        /* card surface */
  --panel-2:#16234a;
  --ink:#eef1f8;          /* main text */
  --muted:#a7b2cf;        /* secondary text */
  --amber:#ffb547;        /* window light, accent */
  --exit:#2bd46e;         /* emergency exit green */
  --line:rgba(167,178,207,.18);
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.55;overscroll-behavior-y:none}
#scene{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;z-index:0;touch-action:pan-y}
#track{position:relative;z-index:-1;width:1px}
.ui{position:fixed;z-index:5}

/* Loading screen */
#loader{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--night);transition:opacity .7s ease,visibility .7s}
#loader.done{opacity:0;visibility:hidden}
.lb{position:fixed;left:0;right:0;height:11vh;background:#000;z-index:40;transition:transform 1.6s cubic-bezier(.7,0,.2,1) .4s;pointer-events:none}
#lbT{top:0}#lbB{bottom:0}
body.live #lbT{transform:translateY(-101%)}body.live #lbB{transform:translateY(101%)}


.card.in>*:nth-child(2){transition-delay:.06s}.card.in>*:nth-child(3){transition-delay:.12s}.card.in>*:nth-child(4){transition-delay:.18s}.card.in>*:nth-child(5){transition-delay:.24s}.card.in>*:nth-child(6){transition-delay:.3s}.card.in>*:nth-child(n+7){transition-delay:.36s}
#snd{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(10,18,38,.8);color:var(--muted);font:600 12px var(--body);cursor:pointer}
#snd[hidden]{display:none}
#snd:hover,#snd[aria-pressed="true"]{color:var(--ink);border-color:var(--amber)}
#snd:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#snd i{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
#snd i b{width:3px;background:currentColor;height:4px;border-radius:1px}
#snd[aria-pressed="true"] i b{animation:eq 1s ease-in-out infinite}
#snd i b:nth-child(2){animation-delay:.2s}#snd i b:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:4px}50%{height:12px}}
@media (max-width:760px){#snd{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 8px);left:auto;right:max(10px,env(safe-area-inset-right,0px));padding:5px 9px}#snd span{display:none}}
@media (prefers-reduced-motion:reduce){.card>*{transition:none}.lb{transition:none}}
#loader .box{display:grid;gap:14px;justify-items:center;padding-inline:max(16px,env(safe-area-inset-left,0px))}
#loader .floors{display:grid;gap:4px}
#loader .floors i{display:block;width:120px;height:14px;border-radius:2px;background:var(--panel-2);animation:lit 1.4s ease-in-out infinite}
#loader .floors i:nth-child(1){animation-delay:.6s}#loader .floors i:nth-child(2){animation-delay:.45s}#loader .floors i:nth-child(3){animation-delay:.3s}#loader .floors i:nth-child(4){animation-delay:.15s}
@keyframes lit{0%,100%{background:var(--panel-2)}50%{background:var(--amber)}}
#loader p{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}

/* Lift panel (floor nav) */
#lift{right:max(14px,calc(env(safe-area-inset-right,0px) + 10px));top:50%;transform:translateY(-50%);display:grid;gap:8px;justify-items:center;padding:12px 8px;background:linear-gradient(180deg,#1b2443,#0f1730);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#led{font-family:var(--mono);font-weight:700;color:var(--amber);background:#05080f;border-radius:6px;padding:4px 6px;min-width:44px;text-align:center;font-size:18px;text-shadow:0 0 8px rgba(255,181,71,.7)}
#lift button{width:38px;height:38px;border-radius:50%;border:1px solid #3a4670;background:radial-gradient(circle at 35% 30%,#3a4670,#1b2443);color:var(--ink);font-family:var(--mono);font-weight:700;font-size:13px;cursor:pointer;transition:box-shadow .25s,color .25s,border-color .25s}
#lift button:hover{border-color:var(--amber)}
#lift button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#lift button.on{color:#1b1200;background:radial-gradient(circle at 35% 30%,#ffd28a,var(--amber));box-shadow:0 0 14px rgba(255,181,71,.8);border-color:var(--amber)}
#lift button.ex{font-size:9px;letter-spacing:.04em;border-color:#1d7a45}
#lift button.ex.on{background:radial-gradient(circle at 35% 30%,#8ff0b4,var(--exit));box-shadow:0 0 14px rgba(43,212,110,.8);border-color:var(--exit)}

/* Direction cue */
#cue{left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:10px 16px 10px 12px;border-radius:999px;background:rgba(10,18,38,.82);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-family:var(--display);font-weight:700;font-stretch:110%;letter-spacing:.02em;font-size:14px;white-space:nowrap;opacity:0;transition:opacity .35s;pointer-events:none;max-width:calc(100vw - 32px)}
#cue .sign{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--amber);color:#1b1200;flex:none}
#cue.exit .sign{background:var(--exit);color:#04210f}
#cue svg{width:18px;height:18px}
#cue .sign svg{animation:nudge 1.3s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
#cue.up .sign svg{animation-name:nudgeUp}
@keyframes nudgeUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* Speech bubble */
#bubble{z-index:8;left:0;top:0;max-width:min(250px,62vw);text-align:center;padding:10px 14px;background:#fff;color:#14182a;border-radius:16px;font-weight:600;font-size:14px;line-height:1.35;box-shadow:0 8px 24px rgba(0,0,0,.35);opacity:0;transform-origin:20% 100%;pointer-events:none;will-change:transform,opacity}
#bubble::after{content:"";position:absolute;left:var(--tail,50%);margin-left:-10px;bottom:-9px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}

/* Cards (visitor pass panels) */
.card{right:calc(max(16px,env(safe-area-inset-right,0px)) + 74px);top:50%;width:min(440px,40vw);max-height:min(78vh,720px);overflow:auto;transform:translateY(-50%);background:linear-gradient(180deg,rgba(22,35,74,.94),rgba(16,26,51,.96));border:1px solid var(--line);border-radius:18px;padding:22px 22px 20px;box-shadow:0 24px 60px rgba(0,0,0,.5);opacity:0;visibility:hidden;scrollbar-width:thin}
.card.left{left:max(24px,env(safe-area-inset-left,0px));right:auto}
.tag{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.tag b{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:5px;background:var(--amber);color:#1b1200;font-weight:700;letter-spacing:0}
.card h2{font-family:var(--display);font-weight:800;font-stretch:105%;font-size:clamp(22px,2.2vw,28px);line-height:1.12;margin:10px 0 4px;text-wrap:balance}
.card h1{font-family:var(--display);font-weight:900;font-stretch:112%;font-size:clamp(30px,3.4vw,46px);line-height:1;margin:12px 0 8px;letter-spacing:-.01em;text-wrap:balance}
.meta{color:var(--muted);font-size:13.5px;margin:0 0 12px}
.card p{margin:0 0 12px}
.card ul{margin:0 0 12px;padding-left:18px;display:grid;gap:6px}
.card li{color:#d9deeb}
.card .chips{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.card .chips li{font-family:var(--mono);font-size:11.5px;padding:4px 8px;border-radius:6px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:#dfe5f4}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:4px 0 14px}
.stats div{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:10px;padding:10px}
.stats strong{display:block;font-family:var(--display);font-weight:800;font-size:22px;color:var(--amber);font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted);line-height:1.3;display:block}
.dir{display:grid;gap:4px;margin:14px 0 0;padding:12px;border-radius:10px;background:#05080f;border:1px solid var(--line);font-family:var(--mono);font-size:12px}
.dir div{display:grid;grid-template-columns:28px 1fr;gap:8px;color:#cfd6ea}
.dir b{color:var(--amber)}
.dir .x b{color:var(--exit)}
.skill-g{display:grid;gap:8px}.skill-g .chips{gap:5px}.skill-g .chips li{padding:3px 7px;font-size:11px}
.skill-g h3{margin:0 0 4px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.award{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;padding:12px;border-radius:12px;background:rgba(0,0,0,.2);border:1px solid var(--line);margin-bottom:10px}
.award svg{width:44px;height:44px}
.award h3{margin:0 0 2px;font-family:var(--display);font-weight:800;font-size:17px}
.award p{margin:0;color:var(--muted);font-size:13.5px}
.contact-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.22);border:1px solid var(--line);margin-bottom:8px}
.contact-row small{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.contact-row a,.contact-row span.v{color:var(--ink);font-weight:600;word-break:break-all;text-decoration:none;user-select:all}
.contact-row a:hover{color:var(--amber)}
.copy{font:600 12px var(--body);color:var(--ink);background:var(--panel-2);border:1px solid #3a4670;border-radius:8px;padding:6px 10px;cursor:pointer}
.copy:hover{border-color:var(--amber)}
.copy:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.exit-badge{display:inline-flex;gap:6px;align-items:center;background:var(--exit);color:#04210f;font:800 11px var(--display);letter-spacing:.12em;padding:4px 8px;border-radius:4px}
#brand{left:max(16px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 14px);font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center}
#brand i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px var(--amber)}
#bar{left:0;top:0;height:3px;width:100%;background:transparent}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),#ffd28a)}

@media (max-width:760px){
  .card,.card.left{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:auto;max-height:50vh;max-height:50dvh;transform:none;padding:16px 16px 14px;border-radius:16px}
  .card h1{font-size:30px}
  .card h2{font-size:21px}
  #lift{top:calc(env(safe-area-inset-top,0px) + 44px);transform:none;right:max(10px,env(safe-area-inset-right,0px));padding:8px 6px;gap:6px}
  #lift button{width:32px;height:32px;font-size:12px}
  #led{font-size:14px;min-width:36px}
  #cue{font-size:12.5px;left:max(16px,env(safe-area-inset-left,0px));transform:none;bottom:auto;top:calc(env(safe-area-inset-top,0px) + 40px);max-width:calc(100vw - 108px);white-space:normal}
  .card[data-card=contact]{max-height:66vh;max-height:66dvh}
  .stats strong{font-size:18px}
  [data-card="hero"] .dir{display:none}
}
@media (prefers-reduced-motion:reduce){
  #cue .sign svg{animation:none}
  #loader .floors i{animation:none;background:var(--amber)}
}
</style>

  sfx.step(amp, s.phase, char.visible);
  if (!reduceMotion) { camera.position.y += Math.sin(time * 0.5) * 0.03; }
  const mob = isMobile();
  const tOX = mob ? 0 : s.offs * introVis * (s.offs < 0 ? 0.2 : 0.19) * innerWidth;
  const tOY = mob ? Math.abs(s.offs) * introVis * 0.2 * innerHeight : 0;
  viewOX += (tOX - viewOX) * (1 - Math.exp(-dt * 8)); viewOY += (tOY - viewOY) * (1 - Math.exp(-dt * 8));
  camera.setViewOffset(innerWidth, innerHeight, viewOX, viewOY, innerWidth, innerHeight);

  if (composer && quality > 0) { vign.uniforms.t.value = time; composer.render(); } else renderer.render(scene, camera);
  // adaptive quality: watch frame time and step down if the device struggles
  perfAcc += dt; perfN++;
  if (perfAcc > 2.5) { const avg = perfAcc / perfN; perfAcc = 0; perfN = 0;
    if (avg > 0.024 && quality > 0) { quality--; if (quality === 1) { dpr = Math.min(dpr, 1.25); layout(); } }
  }

  // ---- overlay UI ----
  let bubbleText = '', bubbleA = 0, topCard = null, topCardV = 0;
  for (const l of LABELS) {
    const v = fade(cur, l.t0, l.t1) * introVis;
    if (!l.card) { const bv0 = fade(cur, l.t0, l.t1, 0.12); if (bv0 > bubbleA) { bubbleA = bv0; bubbleText = l.bubble; } continue; }
    if ((cardVis[l.card] || 0) !== v) {
      const c = cards[l.card]; cardVis[l.card] = v;
      c.style.opacity = v; c.style.visibility = v > 0.01 ? 'visible' : 'hidden';
      if (v > 0.5) c.classList.add('in'); else if (v < 0.15) c.classList.remove('in');
      const base = mob ? `translateY(${(1 - v) * 24}px)` : (l.card === 'hero' ? `translateY(-50%) translateX(${(v - 1) * 30}px)` : `translateY(-50%) translateX(${(1 - v) * 30}px)`);
      c.style.transform = base;
    }
    const bv = l.bubble ? fade(cur, l.t0 + 0.12, l.t1 - 0.05, 0.12) : 0;
    if (bv > bubbleA) { bubbleA = bv; bubbleText = l.bubble; }
    if (v > 0.05 && v >= topCardV) { topCardV = v; topCard = cards[l.card]; }
  }
  if (bubbleText && bubbleText !== lastBubble) { bubble.textContent = bubbleText; lastBubble = bubbleText; }
  if (bubbleA > 0.01 && char.visible) {
    tmpV.set(s.cx, s.cy + 2.4, s.cz).project(camera);
    const x = (tmpV.x * 0.5 + 0.5) * innerWidth, y = (-tmpV.y * 0.5 + 0.5) * innerHeight;
    const bw = bubble.offsetWidth, bh = bubble.offsetHeight;
    // bubble sits right above his head, centred on him
    let bxx = x - bw / 2;
    bxx = Math.max(8, Math.min(innerWidth - bw - (mob ? 76 : 8), bxx));
    let by = Math.max(mob ? 8 : 40, y - bh - 14);
    bubble.style.setProperty('--tail', Math.max(22, Math.min(bw - 22, x - bxx)) + 'px');
    bubble.style.transform = `translate(${bxx}px,${by}px) scale(${0.85 + 0.15 * bubbleA})`;
    bubble.style.opacity = bubbleA * introVis;
  } else bubble.style.opacity = 0;

  let cueA = 0, cueObj = null;
  for (const c of CUES) { const start = c.t0; const v = fade(cur, start, c.t1 - 0.1, 0.15); if (v > cueA) { cueA = v; cueObj = c; } }
  if (cueObj && cueObj.kind + cueObj.text !== lastCueKind) {
    lastCueKind = cueObj.kind + cueObj.text; cueText.textContent = cueObj.text;
    cueEl.className = 'ui ' + cueObj.kind; cueEl.querySelector('svg').innerHTML = ARROWS[cueObj.kind];
  }
  if (auto && cur < C0 - 0.3) { cueA = 1; if (lastCueKind !== 'auto') { lastCueKind = 'auto'; cueText.textContent = 'Heading down the emergency stairs to the main entrance'; cueEl.className = 'ui exit'; cueEl.querySelector('svg').innerHTML = ARROWS.in; } }
  cueEl.style.opacity = cueA * introVis;
  // keep the scroll hint in the empty part of the screen, never on a card
  if (!mob) {
    let cx = innerWidth / 2;
    if (topCard) { const r = topCard.getBoundingClientRect(); cx = r.left > innerWidth / 2 ? r.left / 2 : (r.right + innerWidth - 70) / 2; }
    cueEl.style.left = cx + 'px';
  } else { cueEl.style.left = ''; if (topCard && topCardV > 0.05) { const r = topCard.getBoundingClientRect(); cueEl.style.top = Math.max(60, r.top - 54) + 'px'; } else cueEl.style.top = ''; }

  // lift display
  let ledTxt, onKey;
  if (cur < (HOLDS.summary - 1.6)) { ledTxt = 'IN'; onKey = null; }
  else if (cur > HOLDS.awards + 1.5) { ledTxt = (s.cy > 0.5 && cur < AUTO1) ? String(Math.round(s.cy / H)) : 'EX'; onKey = 'contact'; }
  else { const fl = Math.round(s.cy / H); ledTxt = fl === 0 ? 'G' : String(fl); onKey = ['summary', 'job0', 'education', 'skills', 'awards'][fl]; }
  if (ledTxt !== lastLed) { if (/^[G1-4]$/.test(ledTxt) && /^[G1-4]$/.test(lastLed)) sfx.ding(); led.textContent = ledTxt; lastLed = ledTxt; liftBtns.forEach(b => b.classList.toggle('on', b.dataset.go === onKey)); }
  bar.style.width = (tToU(cur) / TOTAL_U * 100).toFixed(2) + '%';

  requestAnimationFrame(frame);
}
renderer.compile(scene, camera);

// magnetic settle: when scrolling stops near a floor's stop, glide onto it

requestAnimationFrame(() => { frame(); setTimeout(openDoors, 250); });
setTimeout(openDoors, 15000);
window.__tl = { TOTAL, AUTO0, AUTO1, tToU, get auto() { return !!auto; }, HOLDS, settle() { cur = targetT(); firstFrame = true; introT = 1; }, force(t) { forced = t; firstFrame = true; introT = 1; }, get unitPx() { return unitPx; } };
</script>

</body>
</html>
